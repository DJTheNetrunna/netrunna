name: Sync Survivor Library

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_survivor_library.py"
      - ".github/workflows/sync-survivor-library.yml"

permissions:
  contents: write

concurrency:
  group: survivor-library-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build Survivor Library catalog
        run: python scripts/sync_survivor_library.py

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/survivor-library.json; then
            echo "Survivor Library catalog is already current."
            exit 0
          fi
          git config user.name "NETRUNNA Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/survivor-library.json
          git commit -m "Sync Survivor Library ebook catalog"
          git push

# Initial population trigger: keep the generated catalog current through the scheduled job above.
